name: Release ModernCharacterUI

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g., v1.0.0)"
        required: true

jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get the version
        id: get_version
        run: |
          echo "VERSION=${{ github.event.inputs.tag || github.ref_name }}" >> $GITHUB_OUTPUT

      # Runs before the release is published so a bad interface number fails the
      # build instead of shipping a file tagged for the wrong game versions.
      - name: Resolve CurseForge game versions
        id: game_versions
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
        run: python3 .github/scripts/resolve_game_versions.py >> $GITHUB_OUTPUT

      - name: Generate Changelog
        id: generate_changelog
        run: |
          CHANGELOG_RAW=$(git log --pretty=format:'* %s' -n 1 ${{ steps.get_version.outputs.VERSION }})
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "${CHANGELOG_RAW}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Bundle Addon
        run: |
          ADDON_NAME="ModernCharacterUI"
          VERSION="${{ steps.get_version.outputs.VERSION }}"

          TEMP_DIR="/tmp/$ADDON_NAME"
          mkdir -p "$TEMP_DIR"
          rsync -av --exclude='.git' --exclude='.github' --exclude='build' "${{ github.workspace }}/" "$TEMP_DIR/"

          BUILD_DIR="${{ github.workspace }}/build"
          mkdir -p "$BUILD_DIR"

          ZIP_FILE="$BUILD_DIR/$ADDON_NAME-$VERSION.zip"
          cd /tmp
          zip -r "$ZIP_FILE" "./$ADDON_NAME"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: ModernCharacterUI ${{ steps.get_version.outputs.VERSION }}
          body: |
            Changes in this Release:
            ${{ steps.generate_changelog.outputs.CHANGELOG }}
          draft: false
          prerelease: false
          files: build/ModernCharacterUI-${{ steps.get_version.outputs.VERSION }}.zip

      - name: Upload to CurseForge
        uses: itsmeow/curseforge-upload@3.1.1
        with:
          project_id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          file_path: build/ModernCharacterUI-${{ steps.get_version.outputs.VERSION }}.zip
          changelog: Release ${{ steps.get_version.outputs.VERSION }}
          changelog_type: text
          display_name: ModernCharacterUI ${{ steps.get_version.outputs.VERSION }}
          game_endpoint: wow
          # Resolved from the "## Interface:" line in ModernCharacterUI.toc, so bumping
          # the TOC for a new patch is all that is needed to retarget the upload.
          game_versions: ${{ steps.game_versions.outputs.GAME_VERSIONS }}
          relations: "ace3:embeddedLibrary"
          token: ${{ secrets.CURSEFORGE_API_TOKEN }}
